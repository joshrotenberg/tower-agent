[package]
name = "tower-agent-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A Tower-native Claude Code service for tower-agent."

[features]
default = []
legacy-server = ["dep:async-trait", "dep:serde", "dep:tokio", "dep:tower-agent-server"]

[dependencies]
tower-agent.workspace = true
tower.workspace = true
tower-agent-server = { workspace = true, optional = true }

async-trait = { workspace = true, optional = true }
claude-wrapper.workspace = true
serde = { workspace = true, optional = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
