[package]
name = "tower-agent-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "MCP adapter vocabulary for tower-agent, including public continuation identity."
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros"] }
tower.workspace = true
tower-agent.workspace = true
tower-agent-plan = { workspace = true, optional = true }
tower-mcp.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tower-mcp = { workspace = true, features = ["testing"] }

[features]
# Planning at the MCP surface: elicit what a partial turn is missing, then run
# it. Off by default so the adapter's own surface does not depend on the
# planning vocabulary.
plan = ["dep:tower-agent-plan"]
plan-claude = ["plan", "tower-agent-plan/claude"]
plan-codex = ["plan", "tower-agent-plan/codex"]
