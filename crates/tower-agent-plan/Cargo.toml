[package]
name = "tower-agent-plan"
description = "Layered planning vocabulary and resolver for tower-agent turns"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
claude = ["dep:tower-agent-claude", "dep:serde_json"]
codex = ["dep:tower-agent-codex", "dep:serde_json"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
tower = { workspace = true }
tower-agent = { workspace = true }
tower-agent-claude = { workspace = true, optional = true }
tower-agent-codex = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }
