[workspace]
resolver = "3"
members = [
    "crates/tower-agent",
    "crates/tower-agent-claude",
    "crates/tower-agent-codex",
    "examples/agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/tower-agent"
homepage = "https://github.com/joshrotenberg/tower-agent"
readme = "README.md"
keywords = ["tower", "agents", "middleware", "async"]
categories = ["asynchronous", "development-tools"]

[workspace.dependencies]
tower-agent = { path = "crates/tower-agent", version = "0.1.0" }
tower-agent-claude = { path = "crates/tower-agent-claude", version = "0.1.0" }
tower-agent-codex = { path = "crates/tower-agent-codex", version = "0.1.0" }

anyhow = "1"
claude-wrapper = "0.14"
codex-wrapper = "0.4"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["limit", "util"] }
tower-mcp = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
