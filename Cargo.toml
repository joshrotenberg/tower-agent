[workspace]
resolver = "3"
members = ["crates/tower-agent", "crates/tower-agent-claude", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/tower-agent"

[workspace.dependencies]
tower-agent = { path = "crates/tower-agent", version = "0.1.0" }
tower-agent-claude = { path = "crates/tower-agent-claude", version = "0.1.0" }

anyhow = "1"
async-trait = "0.1"
claude-wrapper = "0.13"
clap = { version = "4", features = ["derive"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal"] }
toml = "1"
tower-mcp = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
