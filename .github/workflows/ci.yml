name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust 1.90 workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          rustup default 1.90.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check core dependency boundary
        run: ./scripts/check-core-deps.sh

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The all-features build cannot reach the provider-feature combinations
      # a consumer may select, including the default build with none of them.
      - name: Check the feature matrix
        run: |
          cargo clippy -p tower-agent-plan --all-targets --locked -- -D warnings
          cargo clippy -p tower-agent-plan --all-targets --locked --features claude -- -D warnings
          cargo clippy -p tower-agent-plan --all-targets --locked --features codex -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      # --all-targets excludes doctests, so the examples in the public API
      # need their own step.
      - name: Run doctests
        run: cargo test --workspace --doc --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --locked --no-deps

      - name: Assemble publishable crates
        run: >-
          cargo package
          -p tower-agent
          -p tower-agent-claude
          -p tower-agent-codex
          --allow-dirty --locked --no-verify
