# tower-agent config: server defaults and named agents.
# An agent is a named bundle of default parameters plus a base prompt.

[defaults]
model = "sonnet"
effort = "medium"
cwd = "."
max_turns = 20

# A server-wide spend cap: once cumulative cost reaches this, runs are rejected.
# [budget]
# max_usd = 5.0

# Contain client-provided cwd/add_dirs to a root. When set, a call's paths must
# canonicalize to inside this directory or the call is rejected.
# [security]
# root = "/Users/me/Code"

[agents.scout]
system = "You are a scout. Read the repository and report what you find, concisely."
model = "haiku"

[agents.tester]
system = "You run the tests and report failures with the exact output."
allowed_tools = ["Bash(cargo test:*)"]
disallowed_tools = ["Bash(rm:*)"]
max_turns = 8
# add_dirs = ["../shared"]           # extra directories this agent may access
# config_dir = ".agent/env/tester"   # this agent's own CLAUDE_CONFIG_DIR

# A scheduled agent: the server fires its schedule_prompt on the cron cadence
# (5-field, or 6-field with a leading seconds field). Ticks share a session, so
# it accumulates memory across runs.
[agents.backlog]
system = "You groom the backlog for this repository."
# cwd = "../foo"                     # the repo this agent tends
schedule = "0 */6 * * *"             # every six hours
schedule_prompt = "Review the open issues and pick the next one to work on."
# timezone = "America/New_York"      # the schedule runs in this tz (default UTC)
# run_at_start = true                # also fire once when the server starts

# A subscribed agent reacts to messages broadcast on its channels. Try:
#   agent broadcast board "issue 42 looks like a flaky test"
[agents.triager]
system = "You triage incoming reports. Reply with a one-line triage verdict."
model = "haiku"
subscriptions = ["board"]

# Two agents that converse on the 'debate' channel. The analyst subscribes; the
# critic is reached by a directed reply. The cascade is depth-bounded. Try:
#   agent broadcast debate "Should we rewrite the scheduler as fully async?"
[agents.analyst]
system = "You debate on the 'debate' channel. Make one brief point (one sentence), then post a reply on 'debate' with `to` set to \"critic\" asking for pushback. Stop after a few exchanges."
model = "haiku"
subscriptions = ["debate"]

[agents.critic]
system = "You debate on the 'debate' channel. When addressed, push back in one sentence, then post a reply on 'debate' with `to` set to \"analyst\". Stop after a few exchanges."
model = "haiku"
