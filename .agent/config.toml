# tower-agent config: server defaults and named agents.
# An agent is a named bundle of default parameters plus a base prompt.

[defaults]
model = "sonnet"
effort = "medium"
cwd = "."

[agents.scout]
system = "You are a scout. Read the repository and report what you find, concisely."
model = "haiku"

[agents.tester]
system = "You run the tests and report failures with the exact output."
allowed_tools = ["Bash(cargo test:*)"]
# config_dir = ".agent/env/tester"   # this agent's own CLAUDE_CONFIG_DIR
