# tower-agent config: server defaults and named agents.
# An agent is a named bundle of default parameters plus a base prompt.

[defaults]
model = "sonnet"
effort = "medium"
cwd = "."
max_turns = 20

[agents.scout]
system = "You are a scout. Read the repository and report what you find, concisely."
model = "haiku"

[agents.tester]
system = "You run the tests and report failures with the exact output."
allowed_tools = ["Bash(cargo test:*)"]
disallowed_tools = ["Bash(rm:*)"]
max_turns = 8
# add_dirs = ["../shared"]           # extra directories this agent may access
# config_dir = ".agent/env/tester"   # this agent's own CLAUDE_CONFIG_DIR

# A scheduled agent: the server fires its schedule_prompt on the cron cadence
# (5-field, or 6-field with a leading seconds field). Ticks share a session, so
# it accumulates memory across runs.
[agents.backlog]
system = "You groom the backlog for this repository."
# cwd = "../foo"                     # the repo this agent tends
schedule = "0 */6 * * *"             # every six hours
schedule_prompt = "Review the open issues and pick the next one to work on."

# A subscribed agent reacts to messages broadcast on its channels. Try:
#   agent broadcast board "issue 42 looks like a flaky test"
[agents.triager]
system = "You triage incoming reports. Reply with a one-line triage verdict."
model = "haiku"
subscriptions = ["board"]
